        It's important that you're reaching out and prioritizing your safety and well-being. Experiencing domestic violence can be incredibly traumatic, and it's crucial to find ways to ensure your safety and address the trauma associated with the abuse.
        
        Regarding the triggers for the physical violence, it sounds like excessive alcohol consumption by your partner plays a significant role. When your partner comes home intoxicated, they become aggressive towards you, leading to violent incidents and physical injury. It must be really challenging for you to deal with these situations.
        
        The symptoms you mentioned, including fear, anxiety, and persistent thoughts about being trapped in an abusive cycle, are understandable given the traumatic experiences you've been through. These intense and recurring feelings can have a significant impact on both your mental and physical well-being.
        
        Sharing that you grew up in a household where witnessing domestic violence was normalized adds another layer of complexity to your situation. This upbringing may have influenced your perception of relationships and made it more difficult for you to recognize healthy boundaries or identify red flags earlier on. 
        
        I commend you for seeking support through local helplines and online support groups. These resources can provide temporary solace and validation, but navigating the emotional aftermath and developing long-term safety plans can still be challenging.
        
        In terms of available resources for victims of domestic violence, there are several options you can explore. One important resource is contacting your local domestic violence hotline or shelter. They can provide guidance on creating a safety plan specific to your situation, offer legal protection options such as restraining orders, and connect you with other vital services such as counseling and support groups.
        
        Therapeutic modalities can also play a crucial role in healing from trauma and rebuilding your life in a safe environment. Trauma-focused therapy, such as cognitive-behavioral therapy (CBT) or eye movement desensitization and reprocessing (EMDR), can help you process the trauma and develop healthier coping strategies. Additionally, individual therapy or support groups specifically for survivors of domestic violence can provide a safe space to share your experiences and learn from others who have faced similar challenges.
        
        Remember that healing is a journey, and it's important to prioritize your safety throughout the process. Building a support network of trusted friends, family members, or professionals who can advocate for you and offer emotional support can also be beneficial.
        
        You've taken an important step by reaching out for guidance, and I encourage you to continue seeking help and exploring these resources. You deserve respect, love, and a safe environment to rebuild your life.

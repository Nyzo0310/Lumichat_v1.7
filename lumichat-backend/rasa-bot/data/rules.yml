# ==== Smalltalk / safety (keep) ====
- rule: greet -> utter_greet
  steps:
    - intent: greet
    - action: utter_greet

- rule: goodbye -> utter_goodbye
  steps:
    - intent: goodbye
    - action: utter_goodbye

- rule: safety critical -> crisis
  steps:
    - intent: safety_critical
    - action: utter_crisis

# ---- Coping YES/NO (anchored to the specific coping offer), then offer referral ----
- rule: coping yes -> academic_pressure
  steps:
    - action: utter_offer_coping_academic_pressure
    - intent: affirm
    - action: utter_coping_academic_pressure
    - action: utter_offer_referral


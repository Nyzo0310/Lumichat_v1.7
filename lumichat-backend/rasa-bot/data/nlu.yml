- intent: addiction_p0003
  examples: |
    - "Thank you for providing this space where I can openly discuss my struggles with substance abuse. My primary goal for this counseling session is to seek guidance on overcoming addiction and achieving long-term recovery. Substance abuse has taken control of my life, and it feels like I'm trapped in a never-ending cycle." The roots of my addiction trace back to a difficult period in my life when I lost my job and faced several personal setbacks. In search of an escape from reality, I turned to drugs as a coping mechanism. What started as occasional recreational use quickly escalated into dependency, and now I find it almost impossible to function without substances. One specific event that stands out is when I got arrested for driving under the influence. The experience was not only terrifying but also served as a wake-up call that my addiction had spiraled out of control. It made me realize the potential consequences of my actions on both myself and others. Deep down, I knew this wasn't the life I wanted to lead. The symptoms of my substance abuse are persistent and negatively impact various aspects of my life. I experience intense cravings, often leading to compulsive drug-seeking behavior. These cravings occur multiple times per day and can become overwhelming unless satisfied. Additionally, the consumption of substances has caused strained relationships with family and friends. There have been instances of financial instability, resulting in debt accumulation due to excessive spending on drugs. It's important to mention that my family has a history of substance abuse, which may have contributed to my vulnerability in developing addiction. Growing up, there were always bottles around the house, hidden secrets, and tense arguments related to substance misuse. I never thought I would follow in their footsteps, but here I am facing the same battle. To cope with the challenges of addiction, I've tried attending support groups and seeking professional help. However, relapses have been frequent, and maintaining sobriety seems nearly impossible. I understand that recovery is a lifelong journey, and I'm willing to put in the necessary work to break free from this vicious cycle. I have several questions regarding treatment options. Are there any medications that could aid in reducing withdrawal symptoms? What therapeutic approaches have shown success in long-term recovery from substance abuse?"

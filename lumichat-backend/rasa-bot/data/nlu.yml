- intent: addiction_p0001
  examples: |
    - "I've been struggling with alcohol addiction for years, and it's completely taken over my life. I'm desperate for help and hoping therapy can guide me towards recovery." My battle with alcohol addiction has consumed me entirely. It began as a way to cope with stress and escape reality, but now it controls every aspect of my life. I want more than anything to break free from its grasp and regain control. There isn't one particular triggering event that led to my addiction; rather, it gradually progressed over several difficult periods in my life. From career setbacks to personal losses, the need to numb my emotions became increasingly powerful. A specific situation that highlights the impact of my addiction was when I got a DUI (Driving Under the Influence) last month. The consequences were severe, from legal trouble to damaging my reputation and relationships. It was a wake-up call that I can't keep going down this destructive path. The symptoms of addiction are present every day. The frequency of alcohol consumption has intensified, and it's difficult for me to function without it. I experience intense cravings, withdrawal symptoms when attempting to quit, and an overwhelming sense of despair. To cope with my addiction in the past, I've tried attending support groups and detox programs. While they provided temporary relief, maintaining sobriety in the long term remains challenging. That's why I'm seeking professional guidance to understand the underlying causes of my addiction and develop effective strategies for recovery. During our counseling sessions, I would like to explore the psychological factors contributing to my addiction and learn healthier coping mechanisms. How do you approach treating individuals struggling with addiction? Are there any evidence-based therapies or resources you typically recommend?
    - I want to break free from alcohol
    - I’m ready to take back control of my life
    - how do I stop using as a coping mechanism
    - help me build healthier coping skills
    - I’m scared of relapse but want recovery
    - where do I even start with quitting
    
- intent: addiction_p0002
  examples: |
    - "Thank you for giving me this opportunity to share my struggles with substance abuse. I know it's time for a change, and through counseling, I hope to find the strength and support to overcome these challenges. Substance abuse has become an all-consuming aspect of my life, and I'm ready to break free from its hold." The roots of my addiction are intertwined with unresolved trauma from my past. Childhood abuse and neglect left deep emotional scars that I've been trying to numb through drugs and alcohol. It started as a way to escape the pain temporarily, but over time, it evolved into a full-blown addiction. One specific event triggered by substance abuse occurred last month when I was heavily under the influence at a family gathering. My erratic behavior embarrassed not only myself but also those around me. Witnessing the disappointment and concern on their faces made me realize how destructive my addiction had become. It felt like a wake-up call, revealing the urgent need for professional help. In terms of symptoms, I experience intense cravings and an inability to control my consumption of substances. This leads to excessive use, affecting my physical health and overall well-being. Additionally, withdrawal symptoms, including tremors, nausea, and severe mood swings, manifest when I try to quit or cut back on my substance intake. Considering my family history, where substance abuse has been prevalent across generations, there's a heightened risk for addictive behaviors. Growing up in such an environment normalized substance misuse, making it difficult for me to recognize the harmful impact until it consumed every aspect of my life. To cope with the challenges of addiction, I've tried attending self-help groups, but they haven't provided sustainable solutions. I understand that achieving long-term recovery requires digging deeper into the underlying traumas and developing healthier coping mechanisms. I have a few questions regarding treatment options. Are there any medications available that can aid in managing withdrawal symptoms? How can counselling assist me in addressing the trauma that contributed to my addiction?
